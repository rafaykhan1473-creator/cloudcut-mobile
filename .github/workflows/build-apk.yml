name: Build CloudCut APK
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -qo "$z"; done || true
          PUB=$(grep -rl --include=pubspec.yaml 'name: cloudcut_mobile' . | head -1)
          echo "APP=$(dirname "$PUB")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build (self-healing)
        run: bash "$APP/tool/ci_build.sh" "$APP"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: ${{ env.APP }}/ci-out
      - name: Publish APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: CloudCut APK (latest)
          files: ${{ env.APP }}/build/app/outputs/flutter-apk/CloudCut-*.apk
